apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: restaurant-api
resources:
  - ../../base

patches:
  - path: api-nodeport.yaml

images:
  - name: restaurant-api
    newName: restaurant-api
    newTag: local

secretGenerator:
  - name: restaurant-secrets
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true
